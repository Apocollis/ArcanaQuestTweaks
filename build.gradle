plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.17-kappa'
}

group = 'com.apocollis.aqtweaks'
version = '1.8'
base {
    archivesName.set('ArcanaQuestTweaks')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

configurations {
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader('0.5.7-alpha')
    }

    defaultRemapJar = true
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    fileTree(dir: 'libs', include: ['*.jar']).each { jar ->
        modCompileOnly files(jar)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "aqtweaks",
            "Specification-Vendor": "apocollis",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"apocollis",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "ModType": "CRL",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "MixinConfigs": "mixins.aqtweaks.early.json,mixins.aqtweaks.charm.json"
        ])
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn 'remapJar'
    doLast {
        def jarFile = layout.buildDirectory.file("libs/ArcanaQuestTweaks-${version}.jar").get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Missing remapped jar: ${jarFile}")
        }
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def plate = zip.getEntry("com/apocollis/aqtweaks/rtg/VillagePlate.class")
            if (plate == null) {
                throw new GradleException("VillagePlate.class missing from ${jarFile.name}")
            }
            if (zip.getEntry("mixins.aqtweaks.refmap.json") == null) {
                throw new GradleException("mixins.aqtweaks.refmap.json missing from ${jarFile.name}")
            }
            ["mixins.aqtweaks.json", "mixins.aqtweaks.early.json", "mixins.aqtweaks.charm.json"].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("${name} missing from remapped jar")
                }
            }
            zip.entries().each { e ->
                if (!e.name.endsWith(".class")) {
                    return
                }
                def stream = zip.getInputStream(e)
                def bytes = stream.readAllBytes()
                stream.close()
                if (bytes.length < 8) {
                    throw new GradleException("Truncated class ${e.name}")
                }
                int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                if (major != 65) {
                    throw new GradleException(
                            "${e.name} class major ${major}, expected 65 (Java 21). Do not use --release 8.")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}